<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="title desc">
  <title id="title">Repository language usage pie chart</title>
  <desc id="desc">Pie chart of language usage across public non-fork repositories: HTML 62.7%, Python 18.3%, TypeScript 7.3%, CSS 4.4%, JavaScript 3.1%, HCL 1.6%, and other languages 2.6%.</desc>
  <rect width="760" height="420" rx="18" fill="#111827"/>
  <rect x="20" y="20" width="720" height="380" rx="16" fill="#1a1b27" stroke="#2b2f43"/>

  <text x="48" y="58" fill="#e5e7eb" font-family="Segoe UI, Arial, sans-serif" font-size="24" font-weight="700">Repository Language Usage</text>
  <text x="48" y="85" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="13">Calculated from 16 public, non-fork repositories. Total = 100%.</text>

  <g transform="rotate(-90 210 220)">
    <circle cx="210" cy="220" r="92" fill="none" stroke="#2d3348" stroke-width="46"/>
    <circle cx="210" cy="220" r="92" fill="none" stroke="#e34f26" stroke-width="46" pathLength="100" stroke-dasharray="62.7 37.3" stroke-dashoffset="0"/>
    <circle cx="210" cy="220" r="92" fill="none" stroke="#3776ab" stroke-width="46" pathLength="100" stroke-dasharray="18.3 81.7" stroke-dashoffset="-62.7"/>
    <circle cx="210" cy="220" r="92" fill="none" stroke="#3178c6" stroke-width="46" pathLength="100" stroke-dasharray="7.3 92.7" stroke-dashoffset="-81.0"/>
    <circle cx="210" cy="220" r="92" fill="none" stroke="#1572b6" stroke-width="46" pathLength="100" stroke-dasharray="4.4 95.6" stroke-dashoffset="-88.3"/>
    <circle cx="210" cy="220" r="92" fill="none" stroke="#f7df1e" stroke-width="46" pathLength="100" stroke-dasharray="3.1 96.9" stroke-dashoffset="-92.7"/>
    <circle cx="210" cy="220" r="92" fill="none" stroke="#844fba" stroke-width="46" pathLength="100" stroke-dasharray="1.6 98.4" stroke-dashoffset="-95.8"/>
    <circle cx="210" cy="220" r="92" fill="none" stroke="#94a3b8" stroke-width="46" pathLength="100" stroke-dasharray="2.6 97.4" stroke-dashoffset="-97.4"/>
  </g>

  <circle cx="210" cy="220" r="54" fill="#1a1b27"/>
  <text x="210" y="214" text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="800">100%</text>
  <text x="210" y="238" text-anchor="middle" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="13">language split</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="15">
    <rect x="390" y="128" width="16" height="16" rx="4" fill="#e34f26"/>
    <text x="418" y="141" fill="#e5e7eb">HTML</text>
    <text x="682" y="141" text-anchor="end" fill="#e5e7eb" font-weight="700">62.7%</text>

    <rect x="390" y="165" width="16" height="16" rx="4" fill="#3776ab"/>
    <text x="418" y="178" fill="#e5e7eb">Python</text>
    <text x="682" y="178" text-anchor="end" fill="#e5e7eb" font-weight="700">18.3%</text>

    <rect x="390" y="202" width="16" height="16" rx="4" fill="#3178c6"/>
    <text x="418" y="215" fill="#e5e7eb">TypeScript</text>
    <text x="682" y="215" text-anchor="end" fill="#e5e7eb" font-weight="700">7.3%</text>

    <rect x="390" y="239" width="16" height="16" rx="4" fill="#1572b6"/>
    <text x="418" y="252" fill="#e5e7eb">CSS</text>
    <text x="682" y="252" text-anchor="end" fill="#e5e7eb" font-weight="700">4.4%</text>

    <rect x="390" y="276" width="16" height="16" rx="4" fill="#f7df1e"/>
    <text x="418" y="289" fill="#e5e7eb">JavaScript</text>
    <text x="682" y="289" text-anchor="end" fill="#e5e7eb" font-weight="700">3.1%</text>

    <rect x="390" y="313" width="16" height="16" rx="4" fill="#844fba"/>
    <text x="418" y="326" fill="#e5e7eb">HCL</text>
    <text x="682" y="326" text-anchor="end" fill="#e5e7eb" font-weight="700">1.6%</text>

    <rect x="390" y="350" width="16" height="16" rx="4" fill="#94a3b8"/>
    <text x="418" y="363" fill="#e5e7eb">Other</text>
    <text x="682" y="363" text-anchor="end" fill="#e5e7eb" font-weight="700">2.6%</text>
  </g>
</svg>
