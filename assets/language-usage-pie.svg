<svg xmlns="http://www.w3.org/2000/svg" width="520" height="260" viewBox="0 0 520 260" role="img" aria-labelledby="title desc">
  <title id="title">Repository language usage</title>
  <desc id="desc">Compact chart showing repository language usage: HTML 62.7%, Python 18.3%, TypeScript 7.3%, CSS 4.4%, JavaScript 3.1%, HCL 1.6%, and other languages 2.6%.</desc>

  <rect width="520" height="260" rx="12" fill="#111827"/>
  <rect x="14" y="14" width="492" height="232" rx="10" fill="#171923" stroke="#2f3548"/>

  <text x="28" y="42" fill="#f3f4f6" font-family="Segoe UI, Arial, sans-serif" font-size="18" font-weight="700">Repository Language Usage</text>
  <text x="28" y="62" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="11">16 public non-fork repos, normalized to 100%</text>

  <g transform="rotate(-90 128 146)">
    <circle cx="128" cy="146" r="58" fill="none" stroke="#2d3348" stroke-width="28"/>
    <circle cx="128" cy="146" r="58" fill="none" stroke="#e34f26" stroke-width="28" pathLength="100" stroke-dasharray="62.7 37.3" stroke-dashoffset="0"/>
    <circle cx="128" cy="146" r="58" fill="none" stroke="#3776ab" stroke-width="28" pathLength="100" stroke-dasharray="18.3 81.7" stroke-dashoffset="-62.7"/>
    <circle cx="128" cy="146" r="58" fill="none" stroke="#3178c6" stroke-width="28" pathLength="100" stroke-dasharray="7.3 92.7" stroke-dashoffset="-81.0"/>
    <circle cx="128" cy="146" r="58" fill="none" stroke="#1572b6" stroke-width="28" pathLength="100" stroke-dasharray="4.4 95.6" stroke-dashoffset="-88.3"/>
    <circle cx="128" cy="146" r="58" fill="none" stroke="#f7df1e" stroke-width="28" pathLength="100" stroke-dasharray="3.1 96.9" stroke-dashoffset="-92.7"/>
    <circle cx="128" cy="146" r="58" fill="none" stroke="#844fba" stroke-width="28" pathLength="100" stroke-dasharray="1.6 98.4" stroke-dashoffset="-95.8"/>
    <circle cx="128" cy="146" r="58" fill="none" stroke="#94a3b8" stroke-width="28" pathLength="100" stroke-dasharray="2.6 97.4" stroke-dashoffset="-97.4"/>
  </g>

  <circle cx="128" cy="146" r="33" fill="#171923"/>
  <text x="128" y="143" text-anchor="middle" fill="#f8fafc" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="800">100%</text>
  <text x="128" y="159" text-anchor="middle" fill="#9ca3af" font-family="Segoe UI, Arial, sans-serif" font-size="9">repos</text>

  <g font-family="Segoe UI, Arial, sans-serif" font-size="12">
    <rect x="242" y="86" width="10" height="10" rx="2" fill="#e34f26"/>
    <text x="262" y="95" fill="#e5e7eb">HTML</text>
    <text x="476" y="95" text-anchor="end" fill="#f3f4f6" font-weight="700">62.7%</text>

    <rect x="242" y="112" width="10" height="10" rx="2" fill="#3776ab"/>
    <text x="262" y="121" fill="#e5e7eb">Python</text>
    <text x="476" y="121" text-anchor="end" fill="#f3f4f6" font-weight="700">18.3%</text>

    <rect x="242" y="138" width="10" height="10" rx="2" fill="#3178c6"/>
    <text x="262" y="147" fill="#e5e7eb">TypeScript</text>
    <text x="476" y="147" text-anchor="end" fill="#f3f4f6" font-weight="700">7.3%</text>

    <rect x="242" y="164" width="10" height="10" rx="2" fill="#1572b6"/>
    <text x="262" y="173" fill="#e5e7eb">CSS</text>
    <text x="476" y="173" text-anchor="end" fill="#f3f4f6" font-weight="700">4.4%</text>

    <rect x="242" y="190" width="10" height="10" rx="2" fill="#f7df1e"/>
    <text x="262" y="199" fill="#e5e7eb">JavaScript</text>
    <text x="476" y="199" text-anchor="end" fill="#f3f4f6" font-weight="700">3.1%</text>

    <rect x="242" y="216" width="10" height="10" rx="2" fill="#844fba"/>
    <text x="262" y="225" fill="#e5e7eb">HCL</text>
    <text x="351" y="225" fill="#f3f4f6" font-weight="700">1.6%</text>

    <rect x="384" y="216" width="10" height="10" rx="2" fill="#94a3b8"/>
    <text x="404" y="225" fill="#e5e7eb">Other</text>
    <text x="476" y="225" text-anchor="end" fill="#f3f4f6" font-weight="700">2.6%</text>
  </g>
</svg>
